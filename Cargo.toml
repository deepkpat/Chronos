[package]
name = "chronos"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "sync", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "registry_test"
path = "tests/codec/registry_test.rs"

[[test]]
name = "fs_store_test"
path = "tests/chunk_store/fs_store_test.rs"
